<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1320" viewBox="0 0 1440 1320" role="img" aria-labelledby="title desc"><title id="title">Rascunho do dashboard 2: Gestão do desperdício</title><desc id="desc">Wireframe ilustrativo do aplicativo de desperdício de alimentos. Gráficos e números representam apenas o planejamento visual, não resultados calculados.</desc><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1440" height="1320" rx="0" fill="#F5F3EB"/><rect x="0" y="0" width="264" height="1320" rx="0" fill="#183E32"/><text x="24" y="42" fill="#FFFDF7" font-size="22" font-weight="700" text-anchor="start">FOOD WASTE</text><text x="24" y="65" fill="#C7DACB" font-size="13" font-weight="400" text-anchor="start">Observatório da cozinha</text><line x1="24" y1="86" x2="240" y2="86" stroke="#496658"/><text x="24" y="121" fill="#BFD0BE" font-size="12" font-weight="700" text-anchor="start">RECORTE DA ANÁLISE</text><text x="24" y="158" fill="#FFFDF7" font-size="14" font-weight="600" text-anchor="start">Quantitativas avaliadas</text><rect x="24" y="170" width="216" height="42" rx="8" fill="#294E3E"/><text x="36" y="196" fill="#E7EEDF" font-size="13" font-weight="400" text-anchor="start">6 variáveis selecionadas  ▾</text><text x="24" y="242" fill="#FFFDF7" font-size="14" font-weight="600" text-anchor="start">Variável do intervalo</text><rect x="24" y="254" width="216" height="42" rx="8" fill="#294E3E"/><text x="36" y="280" fill="#E7EEDF" font-size="13" font-weight="400" text-anchor="start">Desperdício atual (kg)  ▾</text><text x="24" y="326" fill="#FFFDF7" font-size="14" font-weight="600" text-anchor="start">Intervalo incluído</text><line x1="38" y1="355" x2="224" y2="355" stroke="#7C927D"/><line x1="50" y1="355" x2="210" y2="355" stroke="#D9A654"/><circle cx="50" cy="355" r="7" fill="#D9A654"/><circle cx="210" cy="355" r="7" fill="#D9A654"/><text x="26" y="385" fill="#C7DACB" font-size="12" font-weight="400" text-anchor="start">mínimo</text><text x="185" y="385" fill="#C7DACB" font-size="12" font-weight="400" text-anchor="start">máximo</text><text x="24" y="431" fill="#FFFDF7" font-size="14" font-weight="600" text-anchor="start">Período observado</text><line x1="38" y1="460" x2="224" y2="460" stroke="#7C927D"/><circle cx="38" cy="460" r="7" fill="#D9A654"/><circle cx="224" cy="460" r="7" fill="#D9A654"/><text x="24" y="491" fill="#E7EEDF" font-size="13" font-weight="400" text-anchor="start">jan/2022 — set/2024</text><text x="24" y="538" fill="#FFFDF7" font-size="14" font-weight="600" text-anchor="start">Categoria do alimento</text><rect x="24" y="550" width="216" height="42" rx="8" fill="#294E3E"/><text x="36" y="576" fill="#E7EEDF" font-size="13" font-weight="400" text-anchor="start">Todas as categorias  ▾</text><text x="24" y="622" fill="#FFFDF7" font-size="14" font-weight="600" text-anchor="start">Presença de evento</text><circle cx="34" cy="649" r="6" fill="#D9A654"/><text x="49" y="654" fill="#FFFDF7" font-size="14" font-weight="400" text-anchor="start">Todos</text><circle cx="34" cy="683" r="6" fill="#7C927D"/><text x="49" y="688" fill="#E7EEDF" font-size="14" font-weight="400" text-anchor="start">Sem evento</text><circle cx="34" cy="717" r="6" fill="#7C927D"/><text x="49" y="722" fill="#E7EEDF" font-size="14" font-weight="400" text-anchor="start">Com evento</text><rect x="24" y="767" width="216" height="42" rx="8" fill="#E5EBDD"/><text x="132" y="794" fill="#183E32" font-size="14" font-weight="600" text-anchor="middle">Limpar filtros</text><text x="24" y="856" fill="#C7DACB" font-size="13" font-weight="400" text-anchor="start">Os filtros valem para</text><text x="24" y="878" fill="#C7DACB" font-size="13" font-weight="400" text-anchor="start">as duas abas.</text><text x="24" y="937" fill="#C7DACB" font-size="12" font-weight="400" text-anchor="start">Base original preservada.</text><text x="24" y="958" fill="#C7DACB" font-size="12" font-weight="400" text-anchor="start">Extremos não excluídos</text><text x="24" y="979" fill="#C7DACB" font-size="12" font-weight="400" text-anchor="start">automaticamente.</text><text x="300" y="43" fill="#61716B" font-size="12" font-weight="600" text-anchor="start">ANÁLISE DO DESPERDÍCIO DE ALIMENTOS</text><rect x="1105" y="20" width="299" height="31" rx="8" fill="#E5EBDD"/><text x="1254" y="41" fill="#183E32" font-size="12" font-weight="700" text-anchor="middle">RASCUNHO · ILUSTRATIVO</text><text x="300" y="100" fill="#183E32" font-size="36" font-weight="700" text-anchor="start">Gestão do desperdício</text><text x="300" y="132" fill="#61716B" font-size="16" font-weight="400" text-anchor="start">Para nutricionistas e gestores de cozinhas de serviços de alimentação.</text><text x="300" y="165" fill="#61716B" font-size="13" font-weight="400" text-anchor="start">911 registros na base • Indicadores respondem ao recorte</text><rect x="300" y="192" width="268" height="48" rx="10" fill="#FFFDF7"/><text x="434" y="223" fill="#61716B" font-size="17" font-weight="600" text-anchor="middle">01  Laboratório</text><rect x="580" y="192" width="268" height="48" rx="10" fill="#183E32"/><text x="714" y="223" fill="#FFFDF7" font-size="17" font-weight="600" text-anchor="middle">02  Gestão</text><rect x="300" y="266" width="204" height="135" rx="13" fill="#FFFDF7" stroke="#DDDAD0"/><text x="317" y="294" fill="#61716B" font-size="13" font-weight="600" text-anchor="start">Desperdício total</text><text x="317" y="339" fill="#183E32" font-size="22" font-weight="700" text-anchor="start">Σ kg</text><text x="317" y="376" fill="#61716B" font-size="12" font-weight="400" text-anchor="start">Volume registrado</text><rect x="525" y="266" width="204" height="135" rx="13" fill="#FFFDF7" stroke="#DDDAD0"/><text x="542" y="294" fill="#61716B" font-size="13" font-weight="600" text-anchor="start">Refeições servidas</text><text x="542" y="339" fill="#183E32" font-size="22" font-weight="700" text-anchor="start">Σ refeições</text><text x="542" y="376" fill="#61716B" font-size="12" font-weight="400" text-anchor="start">Volume de operação</text><rect x="750" y="266" width="204" height="135" rx="13" fill="#FFFDF7" stroke="#DDDAD0"/><text x="767" y="294" fill="#61716B" font-size="13" font-weight="600" text-anchor="start">Por refeição</text><text x="767" y="339" fill="#183E32" font-size="22" font-weight="700" text-anchor="start">g / refeição</text><text x="767" y="376" fill="#61716B" font-size="12" font-weight="400" text-anchor="start">Razão ponderada</text><rect x="975" y="266" width="204" height="135" rx="13" fill="#FFFDF7" stroke="#DDDAD0"/><text x="992" y="294" fill="#61716B" font-size="13" font-weight="600" text-anchor="start">Mediana</text><text x="992" y="339" fill="#183E32" font-size="22" font-weight="700" text-anchor="start">kg / registro</text><text x="992" y="376" fill="#61716B" font-size="12" font-weight="400" text-anchor="start">Centro da distribuição</text><rect x="1200" y="266" width="204" height="135" rx="13" fill="#FFFDF7" stroke="#DDDAD0"/><text x="1217" y="294" fill="#61716B" font-size="13" font-weight="600" text-anchor="start">Acima da meta</text><text x="1217" y="339" fill="#183E32" font-size="22" font-weight="700" text-anchor="start">% registros</text><text x="1217" y="376" fill="#61716B" font-size="12" font-weight="400" text-anchor="start">Referência hipotética</text><rect x="300" y="423" width="1104" height="363" rx="16" fill="#FFFDF7" stroke="#DDDAD0"/><text x="322" y="457" fill="#183E32" font-size="20" font-weight="600" text-anchor="start">Como a intensidade varia ao longo do tempo?</text><text x="322" y="482" fill="#61716B" font-size="13" font-weight="400" text-anchor="start">Série mensal · 1.000 × soma do desperdício / soma das refeições · g/refeição</text><rect x="1030" y="443" width="352" height="34" rx="7" fill="#E5EBDD"/><text x="1043" y="466" fill="#183E32" font-size="13" font-weight="600" text-anchor="start">Meta de simulação: 150 g/refeição</text><line x1="355" y1="526.0" x2="1350" y2="526.0" stroke="#DDDAD0"/><line x1="355" y1="589.3333333333334" x2="1350" y2="589.3333333333334" stroke="#DDDAD0"/><line x1="355" y1="652.6666666666666" x2="1350" y2="652.6666666666666" stroke="#DDDAD0"/><line x1="355" y1="716.0" x2="1350" y2="716.0" stroke="#DDDAD0"/><line x1="355" y1="526" x2="355" y2="716" stroke="#DDDAD0"/><line x1="355" y1="716" x2="1350" y2="716" stroke="#DDDAD0"/><line x1="355" y1="599" x2="1350" y2="599" stroke="#D9A654" stroke-dasharray="7 5"/><text x="1349" y="590" fill="#B26B3B" font-size="12" font-weight="500" text-anchor="end">meta</text><polyline points="355.0,586 389.3103448275862,629 423.62068965517244,603 457.9310344827586,646 492.2413793103448,596 526.551724137931,639 560.8620689655172,613 595.1724137931035,656 629.4827586206897,606 663.7931034482758,649 698.1034482758621,623 732.4137931034483,666 766.7241379310344,616 801.0344827586207,659 835.344827586207,633 869.6551724137931,607 903.9655172413793,626 938.2758620689655,600 972.5862068965517,643 1006.8965517241379,617 1041.2068965517242,636 1075.5172413793102,610 1109.8275862068965,653 1144.1379310344828,627 1178.4482758620688,646 1212.7586206896551,620 1247.0689655172414,663 1281.3793103448274,637 1315.689655172414,587 1350.0,630" fill="none" stroke="#38775B" stroke-width="3" stroke-linejoin="round"/><text x="355" y="744" fill="#61716B" font-size="12" font-weight="400" text-anchor="start">jan/2022</text><text x="845" y="744" fill="#61716B" font-size="12" font-weight="400" text-anchor="start">2023</text><text x="1350" y="744" fill="#61716B" font-size="12" font-weight="400" text-anchor="end">set/2024</text><text x="323" y="772" fill="#61716B" font-size="12" font-weight="400" text-anchor="start">Curva ilustrativa. Meses sem observação não representam desperdício zero.</text><rect x="300" y="808" width="541" height="333" rx="16" fill="#FFFDF7" stroke="#DDDAD0"/><text x="322" y="842" fill="#183E32" font-size="20" font-weight="600" text-anchor="start">Onde o volume se concentra?</text><text x="322" y="867" fill="#61716B" font-size="13" font-weight="400" text-anchor="start">Categorias do alimento · total em kg ou g/refeição</text><rect x="322" y="886" width="197" height="29" rx="7" fill="#E5EBDD"/><text x="333" y="906" fill="#183E32" font-size="12" font-weight="400" text-anchor="start">Total em kg  ▾</text><text x="410" y="958" fill="#61716B" font-size="12" font-weight="400" text-anchor="end">Carne</text><rect x="426" y="944" width="365" height="22" rx="4" fill="#38775B"/><text x="410" y="1001" fill="#61716B" font-size="12" font-weight="400" text-anchor="end">Vegetais</text><rect x="426" y="987" width="208.04999999999998" height="22" rx="4" fill="#8CAB8C"/><text x="410" y="1044" fill="#61716B" font-size="12" font-weight="400" text-anchor="end">Laticínios</text><rect x="426" y="1030" width="175.2" height="22" rx="4" fill="#8CAB8C"/><text x="410" y="1087" fill="#61716B" font-size="12" font-weight="400" text-anchor="end">Grãos</text><rect x="426" y="1073" width="153.29999999999998" height="22" rx="4" fill="#8CAB8C"/><text x="322" y="1121" fill="#61716B" font-size="11" font-weight="400" text-anchor="start">Volume e intensidade respondem a perguntas diferentes.</text><rect x="863" y="808" width="541" height="333" rx="16" fill="#FFFDF7" stroke="#DDDAD0"/><text x="885" y="842" fill="#183E32" font-size="20" font-weight="600" text-anchor="start">E quando há evento?</text><text x="885" y="867" fill="#61716B" font-size="13" font-weight="400" text-anchor="start">Distribuição de g/refeição · pontos extremos mantidos</text><line x1="923" y1="898.0" x2="1355" y2="898.0" stroke="#DDDAD0"/><line x1="923" y1="957.0" x2="1355" y2="957.0" stroke="#DDDAD0"/><line x1="923" y1="1016.0" x2="1355" y2="1016.0" stroke="#DDDAD0"/><line x1="923" y1="1075.0" x2="1355" y2="1075.0" stroke="#DDDAD0"/><line x1="923" y1="898" x2="923" y2="1075" stroke="#DDDAD0"/><line x1="923" y1="1075" x2="1355" y2="1075" stroke="#DDDAD0"/><line x1="1033" y1="920" x2="1033" y2="1064" stroke="#61716B"/><line x1="1013" y1="920" x2="1053" y2="920" stroke="#61716B"/><line x1="1013" y1="1064" x2="1053" y2="1064" stroke="#61716B"/><rect x="989" y="964.5" width="88" height="55" rx="6" fill="#38775B"/><line x1="989" y1="992" x2="1077" y2="992" stroke="#FFFDF7"/><circle cx="1041" cy="907" r="4" fill="#38775B"/><line x1="1235" y1="905" x2="1235" y2="1035" stroke="#61716B"/><line x1="1215" y1="905" x2="1255" y2="905" stroke="#61716B"/><line x1="1215" y1="1035" x2="1255" y2="1035" stroke="#61716B"/><rect x="1191" y="946.0" width="88" height="48" rx="6" fill="#D9A654"/><line x1="1191" y1="970" x2="1279" y2="970" stroke="#FFFDF7"/><circle cx="1243" cy="901" r="4" fill="#D9A654"/><text x="1033" y="1102" fill="#61716B" font-size="13" font-weight="400" text-anchor="middle">Sem evento</text><text x="1235" y="1102" fill="#61716B" font-size="13" font-weight="400" text-anchor="middle">Com evento</text><text x="885" y="1124" fill="#61716B" font-size="11" font-weight="400" text-anchor="start">Comparação descritiva; mostrar n de cada grupo no app.</text><rect x="300" y="1165" width="1104" height="118" rx="12" fill="#E5EBDD"/><text x="322" y="1197" fill="#183E32" font-size="16" font-weight="600" text-anchor="start">Como interpretar</text><text x="322" y="1225" fill="#183E32" font-size="14" font-weight="400" text-anchor="start">A meta é hipotética e ajustável. g/refeição não é percentual de comida desperdiçada.</text><text x="322" y="1252" fill="#183E32" font-size="14" font-weight="400" text-anchor="start">A base não informa a massa preparada. Associação com eventos não demonstra causalidade.</text></g></svg>